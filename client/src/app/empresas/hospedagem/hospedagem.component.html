<section class="hospd-section">
  <div class="container">
    <h1 class="hospd-title text-uppercase text-center">Hospedagem</h1>

    <div class="d-flex gap-5 justify-content-center py-4">
      <button class="btn btn-primary text-uppercase fw-bold rounded-pill px-4" type="button"
        (click)="tipoHospegadem('hotel')">Hotel</button>
      <button class="btn btn-warning text-uppercase fw-bold rounded-pill px-4" (click)="tipoHospegadem('pousada')"
        type="button">Pousada</button>
      <button class="btn btn-success text-uppercase fw-bold rounded-pill px-4" (click)="tipoHospegadem('hostel')"
        type="button">Hostel</button>
      <button class="btn btn-info text-uppercase fw-bold rounded-pill px-4" (click)="tipoHospegadem('resort')"
        type="button">Resort</button>
      <button class="btn btn-dark text-uppercase fw-bold rounded-pill px-4" (click)="getParceiros()"
        type="button">Todas Hospedagem</button>
    </div>

    <div class="container empty-state text-center" *ngIf="lista_parcerias.length === 0">
    <div class="empty-card">
      <img src="../../../assets/midia/icons/box_empty.png" alt="Sem dados" class="empty-icon">
      <h3>Nenhum estabelecimento encontrado</h3>
      <p>Atualmente não há registros nesta categoria. Volte mais tarde ou explore outras opções.</p>
      <button class="btn btn-primary mt-3" (click)="getParceiros()">
        Voltar
      </button>
    </div>
  </div>

    <!-- Carousel -->
    <div id="hospdCarousel" class="carousel slide mt-3" data-bs-ride="carousel">
      <div class="carousel-inner">

        <div class="carousel-item" *ngFor="let grupo of lista_parcerias; let i = index"
          [ngClass]="{ 'active': i === 0 }">
          <div class="row justify-content-center align-items-stretch">
            <div class="col-12 col-md-6 col-lg-4 d-flex" *ngFor="let hospedagem of grupo">
              <div class="hospd-card flex-fill d-flex flex-column">

                <!-- Círculo da logo -->
                <div class="hospd-icon">
                  <img *ngIf="hospedagem.logoUrl" [src]="hospedagem.logoUrl" alt="logo {{ hospedagem.nome_fantasia }}" />
                  <!-- <span *ngIf="!hospedagem.logoUrl" class="text-center">Logo não adicionada</span> -->
                </div>

                <!-- Nome e descrição -->
                <h6 class="fw-bold">{{ hospedagem.nome_fantasia }}</h6>
                <p class="description">{{ hospedagem.espacos_culturais }}</p>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Controles -->
      <button class="carousel-control-prev" type="button" data-bs-target="#hospdCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#hospdCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Próximo</span>
      </button>
    </div>

    <div class="hospd-icon-return text-start pt-4">
      <a routerLink="/ondeficar/home">
        <img src="../../../assets/midia/icons/volte.png" alt="Retorno">
      </a>
    </div>
  </div>
</section>
