<div class="page-wrapper">
  <header class="topbar">
    <div class="logo">Nomads Experience</div>

    <!-- 🔍 FILTROS -->
    <div class="search-bar">

      <!-- 🏙️ AUTOCOMPLETE CIDADE -->
      <input type="text" placeholder="Cidade" [(ngModel)]="filtroCidade" (input)="filtrarCidades()"
        (focus)="mostrarSugestoes = true">

      <ul class="autocomplete" *ngIf="mostrarSugestoes && cidadesFiltradas.length">
        <li *ngFor="let cidade of cidadesFiltradas" (click)="selecionarCidade(cidade)">
          {{ cidade }}
        </li>
      </ul>

      <!-- 🌎 REGIÃO -->
      <select [(ngModel)]="filtroRegiao" (change)="aplicarFiltro()">
        <option value="">Todas Regiões</option>
        <option *ngFor="let reg of regioes" [value]="reg">
          {{ reg }}
        </option>
      </select>

      <!-- 🎯 TIPO -->
      <select [(ngModel)]="filtroTipo" (change)="aplicarFiltro()">
        <option value="">Todos Tipos</option>
        <option *ngFor="let tipo of tipos" [value]="tipo">
          {{ tipo }}
        </option>
      </select>

      <!-- 📅 DATA -->
      <input type="date" [(ngModel)]="filtroData" (change)="aplicarFiltro()">

      <!-- 🔍 BOTÕES -->
      <button (click)="aplicarFiltro()">Buscar</button>

      <button class="btn-clear" (click)="limparFiltros()">
        Limpar
      </button>

    </div>
  </header>

  <main class="content">
    <section>
      <div class="section-header">
        <h2>Experiências em destaque</h2>

        <a routerLink="/experience/create">
          <button class="btn-create">Criar Experience</button>
        </a>
      </div>

      <!-- 🧩 CARDS -->
      <div class="cards-grid">
        <div class="card" *ngFor="let item of paginatedExperiences">
          <img [src]="item.image" [alt]="item.title">

          <div class="card-body">
            <h3>{{ item.title }}</h3>

            <p><strong>Cidade:</strong> {{ item.cidade }}</p>
            <p><strong>Região:</strong> {{ item.regiao }}</p>
            <p><strong>Tipo:</strong> {{ item.tipo }}</p>
            <p><strong>Data:</strong> {{ item.data | date:'dd/MM/yyyy' }}</p>

            <span class="price">{{ item.price }}</span>

            <div class="card-actions">
              <button class="btn-participar" (click)="participar(item)">
                Participar
              </button>

              <button class="btn-inscritos" *ngIf="user_id == item.usuario_id" (click)="verInscritos(item)">
                Ver Inscritos
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="paginatedExperiences.length === 0">
          <p>Nenhuma experience encontrada.</p>
        </div>
      </div>

      <!-- 📄 PAGINAÇÃO -->
      <div class="pagination" *ngIf="totalPages > 1">
        <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
          Anterior
        </button>

        <span>Página {{ currentPage }} de {{ totalPages }}</span>

        <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">
          Próxima
        </button>
      </div>
    </section>
  </main>
</div>
