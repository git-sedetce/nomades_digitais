<div class="container-fluid tipoTurismo py-4">

  <div class="row">

    <!-- Sidebar Desktop -->
    <aside class="col-lg-2 col-md-3 d-none d-md-block">
      <div class="sidebar shadow-sm">

        <h5>Turismo no Ceará</h5>

        <div class="sidebar-links">
          <a
            *ngFor="let tipo of lista_estilo_turismo"
            (click)="pegarTipoTurismo(tipo.nome)">
            {{ tipo.nome }}
          </a>
        </div>

      </div>
    </aside>

    <!-- Conteúdo -->
    <section class="col-12 col-md-9 col-lg-10">

      <!-- Header/Filtro -->
      <div class="filter-container shadow-sm">

        <div class="row g-3 align-items-center">

          <!-- Select Mobile -->
          <div class="col-12 d-block d-md-none">
            <select
              class="form-select"
              #tipo_turismo_mobile
              (change)="pegarTipoTurismo(tipo_turismo_mobile.value)">

              <option disabled selected>
                Tipo de Turismo
              </option>

              <option
                *ngFor="let tipo of lista_estilo_turismo"
                [value]="tipo.nome">

                {{ tipo.nome }}

              </option>

            </select>
          </div>

          <!-- Pesquisa -->
          <div class="col-12 col-lg-4">
            <input
              type="text"
              class="form-control"
              placeholder="Pesquisar cidade..."
              [(ngModel)]="searchTerm"
              (input)="filtrarCards()">
          </div>

          <!-- Município -->
          <div class="col-12 col-md-6 col-lg-3">
            <select
              class="form-select"
              #city
              (change)="filtrarMunicipio(city.value)">

              <option selected disabled>
                Selecione o Município
              </option>

              <option
                *ngFor="let city of lista_cidades"
                [value]="city.nome_municipio">

                {{ city.nome_municipio }}

              </option>

            </select>
          </div>

          <!-- Tipo selecionado -->
          <div class="col-12 col-lg-3">
            <div class="selected-filter">

              <span class="fw-bold">Tipo:</span>

              <span *ngIf="turismo_selected">
                {{ tipo_turismo }}
              </span>

              <span *ngIf="!turismo_selected">
                Todos
              </span>

            </div>
          </div>

          <!-- Botão -->
          <div class="col-12 col-md-6 col-lg-2">
            <button
              class="btn btn-warning w-100 fw-semibold"
              (click)="limparFiltro()">

              Limpar

            </button>
          </div>

        </div>

      </div>

      <!-- Sem registros -->
      <div *ngIf="!has_city" class="alert alert-info mt-4">
        Não há cidades cadastradas.
      </div>

      <!-- Cards -->
      <div *ngIf="has_city">

        <div class="row g-4 mt-1">

          <div
            class="col-12 col-sm-6 col-lg-4"
            *ngFor="let cidades of paginatedCities">

            <div class="card city-card h-100">

              <div class="image-wrapper">

                <img
                  *ngIf="cidades.imagem; else noImage"
                  [src]="cidades.imagem"
                  class="card-img-top"
                  alt="{{ cidades.cidade }}">

                <ng-template #noImage>
                  <div class="no-image">
                    Imagem não disponível
                  </div>
                </ng-template>

              </div>

              <div class="card-body d-flex flex-column">

                <h5 class="card-title">
                  {{ cidades.cidade }}
                </h5>

                <span class="category">
                  {{ cidades.tipo_turismo }}
                </span>

                <p class="region">
                  {{ cidades.regiao }}
                </p>

                <button
                  class="btn-saiba mt-auto"
                  (click)="saibaMais(cidades.municipio_id)">

                  Saiba Mais

                </button>

              </div>

            </div>

          </div>

        </div>

        <!-- Paginação -->
        <div
          class="pagination-wrapper"
          *ngIf="totalPages > 1">

          <button
            class="btn btn-outline-primary"
            [disabled]="currentPage === 1"
            (click)="previousPage()">

            Anterior

          </button>

          <button
            *ngFor="let page of pages"
            class="btn"
            [ngClass]="page === currentPage ? 'btn-primary' : 'btn-outline-primary'"
            (click)="goToPage(page)">

            {{ page }}

          </button>

          <button
            class="btn btn-outline-primary"
            [disabled]="currentPage === totalPages"
            (click)="nextPage()">

            Próxima

          </button>

        </div>

      </div>

    </section>

  </div>

</div>
