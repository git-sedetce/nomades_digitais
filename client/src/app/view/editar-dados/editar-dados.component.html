<section id="forms">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card card_manual mb-5 mt-5 manual text-center fw-bold">
          <div class="card-body">
            <h3 class="mb-2 mt-2">Editar Cadastro</h3>
          </div>
        </div>

        <div class="card card_table mb-5">
          <table class="table table-striped table-hover">
            <thead>
              <tr class="cabecalho">
                <th scope="col" rowspan="2" class="text-center align-middle">Dados cadastrados</th>
                <th class="table align-middle"><button (click)="onViewPartner(user_id)" type="button"
                  class="btn btn-warning mx-3" data-bs-toggle="modal" data-bs-target="#modalParceria"><i
                    class="bi bi-pencil-square"></i></button></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="table align-middle ps-5">CNPJ</td>
                <td class="table align-middle text-capitalize text-center">pra colocar o cnpj {{ parceiro }}</td>

              </tr>
            </tbody>
          </table>

        </div>
      </div>

    </div>
  </div>

</section>
